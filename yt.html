<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>YouTube player</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    p { color: #ccc; font: 14px system-ui, sans-serif; padding: 16px; }
  </style>
</head>
<body>
  <script>
    // Usage: yt.html#v=VIDEO_ID&t=SECONDS  — shows the official YouTube embedded player.
    (function () {
      var params = new URLSearchParams(location.hash.slice(1));
      var id = params.get("v") || "";
      var start = parseInt(params.get("t") || "0", 10) || 0;
      if (!/^[A-Za-z0-9_-]{11}$/.test(id)) {
        document.body.innerHTML = "<p>No video. Use yt.html#v=VIDEO_ID</p>";
        return;
      }
      var frame = document.createElement("iframe");
      frame.src = "https://www.youtube.com/embed/" + id + "?autoplay=1" + (start ? "&start=" + start : "");
      frame.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen";
      frame.referrerPolicy = "strict-origin-when-cross-origin";
      frame.allowFullscreen = true;
      document.body.appendChild(frame);
      addEventListener("hashchange", function () { location.reload(); });
    })();
  </script>
</body>
</html>
